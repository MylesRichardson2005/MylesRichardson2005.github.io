<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it">
                <h1>ART FOREVER</h1>
            </div>
            
            <div class="post-it periwinkle">
                <p>This is my peak.</p>
                <img
                    src="images/supe-sonic.jpg" 
                    height="100"
                    alt="Super Sonic"
                >
            </div>
            <div class="post-it polaroid">
                <img
                    src="images/pizza.webp"
                    height="150"
                    alt="Pizza"
                >
                <p>
                    The good life.
                    <span>08/11/2026</span>
                </p>
            </div>
            <div class="post-it periwinkle">
                <ul>
                    <li>Eggs</li>
                    <li>Carton of Milk</li>
                    <li>Cheddar</li>
                    <li>Pancake mix</li>
                </ul>
            </div>
        </div>
    </body>
</html>
