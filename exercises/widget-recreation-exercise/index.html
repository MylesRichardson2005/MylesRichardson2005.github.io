<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Widget Recreation Exercise</title>
        <link 
            rel="stylesheet" 
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"

            referrerpolicy="no-referrer"

        <link rel="stylesheet" href="css/style.css">

    <body>
        
        <div id="weather">
            <img id="picture"
                src="images/partly-sunny.svg" 
                alt="partly cloudy" 
            > 
            <p id="temp.">
                81°
            </p>
            
            <p id="time">
                14:26
            </p>

                <br>
                Seattle, WA
            </p>
            </div>
        </body>
